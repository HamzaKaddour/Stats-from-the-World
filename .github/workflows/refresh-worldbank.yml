name: Refresh Global Development Data

on:
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/refresh-worldbank.yml"
  schedule:
    - cron: "17 8 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: world-bank-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ETL dependencies
        run: pip install pandas pyarrow requests

      - name: Refresh and validate World Bank dataset
        run: python scripts/etl_worldbank.py

      - name: Build multi-source World Bank + IMF dataset
        run: python scripts/build_multisource.py

      - name: Commit dataset only when changed
        run: |
          if git diff --quiet -- data/processed/econ_option_a.parquet data/processed/global_economy.parquet data/processed/data_manifest.json; then
            echo "No dataset changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/econ_option_a.parquet data/processed/global_economy.parquet data/processed/data_manifest.json
          git commit -m "data: refresh global development indicators"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Remote changed during push; retrying ($attempt/5)..."
            sleep 2
          done
          echo "Failed to publish refreshed data after 5 attempts."
          exit 1
