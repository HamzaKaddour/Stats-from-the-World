name: Publish repository release

on:
  push:
    paths:
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Publish v1.0.0 if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: "v1.0.0"
          TITLE: "Global Development Intelligence v1.0.0"
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
First portfolio release of the source-aware global development intelligence platform.

Highlights:
- World Bank WDI + IMF WEO multi-source integration
- metric-level provenance and reported-vs-projection status
- six development domains and 19 curated indicators
- country benchmarking, progress views, map/table exploration
- automated ETL, validation, Parquet analytical layer, and GitHub Pages delivery
- reproducible Codespaces development environment
EOF

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file /tmp/release-notes.md \
            --latest
